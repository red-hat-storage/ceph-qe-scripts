[pytest]
markers =
    sanity: Core zipper smoke (CRUD / health)
    feature: Feature coverage (ACL, checksum, policy, PAB, versioning, lock)
    multipart: Multipart upload scenarios
    copy: Copy-object scenarios
    admin: Admin / user / bucket management
    user_type: Parametrized across normal/tenant/subuser/account users
    scale: Bucket/object scale (1..10K buckets, 100K objects)
    bug: BZ / Jira regression coverage (IBMCEPH-*)
    slow: Long-running (>2 min) tests
    stability: Zipper health / restart_count checks

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s

addopts = -v --tb=short
