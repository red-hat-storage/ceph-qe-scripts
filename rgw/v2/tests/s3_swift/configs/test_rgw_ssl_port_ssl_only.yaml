# script-name: test_rgw_ssl_port.py
# test-case: TC-5
# covers: SSL-only daemon — no plain HTTP port configured
# pass: only :443 listening; HTTP connection refused; HTTPS S3 IO succeeds
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: ssl_only
    service_id: ssl-port-ssl-only
    # rgw_frontend_port intentionally absent — SSL-only
    rgw_frontend_ssl_port: 443
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    use_http_endpoint: false       # no plain HTTP port to connect to
    verify_no_http_listener_on: 8080
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    cleanup_service: true
    wait_timeout: 300
    port_wait_timeout: 120
