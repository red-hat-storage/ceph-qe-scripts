# script: test_head_obj_op_metrics_iam_scale.py
# polarion id: CEPH-83632452
# ISCE-3042: HEAD Object op metrics at IAM account scale (500 users)
# Note: use haproxy: false with --rgw-node <rgw_host> when haproxy is on the client
config:
  haproxy: false
  bucket_count: 1
  objects_count: 10
  objects_size_range:
    min: 5
    max: 15
  test_ops:
    test_head_obj_metrics_iam_scale: true
    num_iam_users: 500
    account_name: head-metrics-scale
    account_email: head-metrics-scale@example.com
    enable_user_counters_cache: true
    enable_bucket_counters_cache: true
    verify_prometheus: false
    delete_bucket_object: true
    max_users: 1000
    max_buckets: 1000
