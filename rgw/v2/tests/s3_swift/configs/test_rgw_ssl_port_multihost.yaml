# script-name: test_rgw_ssl_port.py
# test-case: TC-11
# covers: 3-host placement — all hosts bind the same rgw_frontend_ssl_port
# pass: all 3 daemons running; ssl_port :443 listening on each host;
#       HTTPS S3 IO succeeds against each host individually
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: multihost
    service_id: ssl-port-multihost
    rgw_frontend_port: 8080
    rgw_frontend_ssl_port: 443
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
      - ceph-local-02
      - ceph-local-03
    perform_s3_io: true
    use_ssl_endpoint: true
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    cleanup_service: true
    wait_timeout: 360
    port_wait_timeout: 120
