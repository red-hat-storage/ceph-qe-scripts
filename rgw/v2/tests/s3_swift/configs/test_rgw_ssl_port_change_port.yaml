# script-name: test_rgw_ssl_port.py
# test-case: TC-7
# covers: day-2 reconfiguration — change rgw_frontend_ssl_port from 443 to 8443
# pass: old port :443 is released; new port :8443 is active; HTTPS S3 IO on :8443 succeeds
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: change_ssl_port
    service_id: ssl-port-change
    rgw_frontend_port: 8080
    rgw_frontend_ssl_port: 443    # initial port
    new_ssl_port: 8443            # target port after day-2 reconfiguration
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    redeploy_settle_secs: 30
    cleanup_service: true
    wait_timeout: 360
    port_wait_timeout: 120
