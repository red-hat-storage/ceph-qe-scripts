# script-name: test_rgw_ssl_port.py
# test-case: TC-6
# covers: generate_cert: true — self-signed cert is bound to the configured ssl_port
# pass: openssl s_client shows a certificate on the configured port;
#       HTTPS S3 IO succeeds
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: cert_binding
    service_id: ssl-port-cert-bind
    rgw_frontend_ssl_port: 8443
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    verify_cert_binding: true
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    cleanup_service: true
    wait_timeout: 300
    port_wait_timeout: 120
