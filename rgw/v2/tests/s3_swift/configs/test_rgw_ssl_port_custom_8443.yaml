# script-name: test_rgw_ssl_port.py
# test-case: TC-4
# covers: non-standard SSL port 8443 — port 443 must NOT be opened
# pass: daemon binds :8443; :443 is NOT listening; HTTPS S3 IO on :8443 succeeds
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: custom_ssl_port
    service_id: ssl-port-8443
    rgw_frontend_port: 8080
    rgw_frontend_ssl_port: 8443
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    download_object: true
    delete_bucket_object: true
    verify_no_listener_on: 443    # 443 must remain closed
    verify_orch_export: true
    verify_listeners: true
    cleanup_service: true
    wait_timeout: 300
    port_wait_timeout: 120
