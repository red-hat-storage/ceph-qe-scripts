# script-name: test_rgw_ssl_port.py
# test-case: TC-3
# covers: inference rule B — rgw_frontend_ssl_port set without ssl:
# expected: cephadm automatically infers ssl: true
# pass: orch export shows ssl: true; daemon presents TLS on :443
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: infer_from_port
    service_id: ssl-port-infer-port
    rgw_frontend_ssl_port: 443
    generate_cert: true
    # ssl intentionally absent — inference under test
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    cleanup_service: true
    wait_timeout: 300
    port_wait_timeout: 120
