# script-name: test_rgw_ssl_port.py
# test-case: TC-2
# covers: inference rule A — ssl: true set without rgw_frontend_ssl_port
# expected: cephadm automatically sets rgw_frontend_ssl_port: 443
# pass: orch export shows rgw_frontend_ssl_port: 443; daemon listens on :443
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: infer_ssl_true
    service_id: ssl-port-infer-ssl
    # rgw_frontend_ssl_port intentionally absent — inference under test
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    cleanup_service: true
    wait_timeout: 300
    port_wait_timeout: 120
