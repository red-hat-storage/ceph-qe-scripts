# script-name: test_rgw_ssl_port.py
# test-case: TC-8
# covers: day-2 SSL removal — revert from ssl: true to HTTP-only
# pass: :443 listener gone after revert; orch export has no ssl/ssl_port fields;
#       HTTP S3 IO on plain port succeeds
config:
  user_count: 1
  objects_count: 3
  objects_size_range:
    min: 5
    max: 50
  test_ops:
    scenario: remove_ssl
    service_id: ssl-port-remove
    rgw_frontend_port: 8080
    rgw_frontend_ssl_port: 443    # initial SSL port; removed on day-2
    http_port_after_revert: 8080  # HTTP-only port after removing SSL
    ssl: true
    generate_cert: true
    rgw_frontend_type: beast
    rgw_realm: default
    rgw_zonegroup: default
    rgw_zone: default
    rgw_exit_timeout_secs: 120
    placement_hosts:
      - ceph-local-01
    perform_s3_io: true
    use_ssl_endpoint: true
    download_object: true
    delete_bucket_object: true
    verify_orch_export: true
    verify_listeners: true
    redeploy_settle_secs: 30
    cleanup_service: true
    wait_timeout: 360
    port_wait_timeout: 120
