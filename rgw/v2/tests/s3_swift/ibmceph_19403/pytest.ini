[pytest]
markers =
    ibmceph_mpu: IBMCEPH-19403 multipart upload completion race tests
    ibmceph_race: IBMCEPH-19403 overwrite, delete, copy and bucket-index race tests
    ibmceph_cond: IBMCEPH-19403 conditional request tests
    ibmceph_cls: IBMCEPH-19403 bucket index cls tests (python-rados, no RGW)
    ibmceph_control: control runs that must pass on fixed and unfixed builds
    ibmceph_all: all IBMCEPH-19403 epic tests
    slow: tests that run for several minutes

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s

# Sequential only: the tests share RGW config, gdb sessions and the cluster.
# xdist (-n) and random ordering are switched off on purpose.
addopts = -v --tb=short -p no:xdist -p no:randomly
