# script: test_archive_bucket_stats.py
# Create a bucket and upload objects from primary, verify on secondary and
# archive, delete from primary, then verify -deleted bucket stats on archive
config:
  user_count: 1
  bucket_count: 1
  objects_count: 10
  local_file_delete: true
  user_remove: false
  objects_size_range:
    min: 5
    max: 15
  test_ops:
    create_bucket: true
    create_object: true
    delete_bucket: true
    verify_remote_sites: true
    verify_archive_deleted_bucket: true
