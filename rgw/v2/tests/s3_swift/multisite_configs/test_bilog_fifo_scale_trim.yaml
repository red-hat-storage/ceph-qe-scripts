# script: test_bilog_fifo_scale.py
# polarion_id: TBD
# cases: S3.1 2h write+autotrim, S3.2 lagging secondary
# timeout: >= 2.5h in cephci
config:
  user_count: 1
  bucket_count: 1
  objects_count: 10000
  objects_size_range:
    min: 5
    max: 5
  test_ops:
    scenario: trim_at_scale
    bilog_type: fifo
    trim_duration_seconds: 7200
    sample_interval_seconds: 600
    pre_lag_objects: 100
    lag_objects: 100
