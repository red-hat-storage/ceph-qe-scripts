[pytest]
addopts = --strict-markers
markers =
    awscli: optional AWS CLI CRUD
    elbencho: optional Elbencho CRUD
    sanity: P0 CRUD coverage
    integration: requires a running RGW endpoint
    lifecycle: lifecycle policies and expiration
    gc: garbage collection queue verification
    notifications: delivery to a supplied SQS destination
    resharding: explicit bucket resharding
    slow: asynchronous cluster processing
